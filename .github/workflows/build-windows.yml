name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Mostrar versiones
        shell: powershell
        run: |
          java --version
          mvn --version
          jpackage --version

      - name: Compilar proyecto con Maven
        run: mvn --batch-mode clean package

      - name: Preparar archivos para jpackage
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path input
          Copy-Item "target/Repuestos-app-jar-with-dependencies.jar" "input/Repuestos-app-jar-with-dependencies.jar"

      - name: Crear instalador EXE
        shell: powershell
        run: |
          jpackage `
            --type exe `
            --name "RepuestosApp" `
            --input input `
            --dest output `
            --main-jar "Repuestos-app-jar-with-dependencies.jar" `
            --main-class "com.aeroagro.repuestos.Main" `
            --app-version "1.0.0" `
            --vendor "Matiasnm14" `
            --win-dir-chooser `
            --win-shortcut `
            --win-menu

      - name: Mostrar archivos generados
        shell: powershell
        run: |
          Get-ChildItem -Recurse output

      - name: Subir instalador
        uses: actions/upload-artifact@v7
        with:
          name: RepuestosApp-Windows
          path: output/*.exe
